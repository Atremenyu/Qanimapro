<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="100%" stop-color="#181b2a"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="3"/>

  <!-- Orbital Animation Rings -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="14 10" opacity="0.35"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#818cf8" stroke-width="4" opacity="0.5"/>

  <!-- Dynamic Vector Motion Glyph -->
  <path d="M 160 140 L 320 256 L 160 372 Z" fill="url(#primaryGrad)" filter="url(#glow)"/>
  
  <!-- Bezier Control Handles & Nodes -->
  <circle cx="160" cy="140" r="14" fill="#ffffff" stroke="#3b82f6" stroke-width="4"/>
  <circle cx="320" cy="256" r="16" fill="#ffffff" stroke="#6366f1" stroke-width="4"/>
  <circle cx="160" cy="372" r="14" fill="#ffffff" stroke="#a855f7" stroke-width="4"/>
  
  <!-- Motion Sparkle Core -->
  <path d="M 370 140 Q 370 180 410 180 Q 370 180 370 220 Q 370 180 330 180 Q 370 180 370 140 Z" fill="url(#accentGrad)" filter="url(#glow)"/>
</svg>
